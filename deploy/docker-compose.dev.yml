# Local development services. Apps run on the host with `pnpm dev`.
#   pnpm services:up      (or: docker compose -f deploy/docker-compose.dev.yml up -d --wait)
name: folderpilot-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: folderpilot
      POSTGRES_PASSWORD: folderpilot
      POSTGRES_DB: folderpilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folderpilot -d folderpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
