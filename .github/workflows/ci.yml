name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: folderpilot
          POSTGRES_PASSWORD: folderpilot
          POSTGRES_DB: folderpilot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U folderpilot" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://folderpilot:folderpilot@localhost:5432/folderpilot
      TEST_DATABASE_URL: postgres://folderpilot:folderpilot@localhost:5432/folderpilot
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (Postgres + Redis)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Dependency audit (high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
