name: Deploy to GitHub Pages

# Builds the web app (device-only mode) for https://<owner>.github.io/<repo>/ and publishes it to the gh-pages branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folderpilot/web test
      # Device-only build: Private mode in the browser, no server or accounts.
      - run: pnpm --filter @folderpilot/web build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_LOCAL_ONLY: "1"
      - name: Publish apps/web/dist to gh-pages
        run: |
          cd apps/web/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
