# One-click deployment on Render (https://render.com) — see docs/DEPLOY.md.
# Creates: the FolderPilot service (API + web app + worker in one container), Postgres 16 and Redis-compatible Key Value.
services:
  - type: web
    name: folderpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt # EU by default (spec §13)
    plan: free # 512 MB, sleeps after 15 minutes idle; pick "starter" or higher to keep it awake
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: folderpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: folderpilot-redis
          property: connectionString
      # 256-bit random values generated by Render on first deploy. Keep them: changing them signs everyone out
      # and makes stored Google tokens / AI keys unreadable.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Google sign-in + Google Drive (docs/SETUP.md §2). Leave empty at first; add them once you know your URL.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: FolderPilot AI (Anthropic). Without it, choose an AI per organization in Settings → AI.
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: keyvalue
    name: folderpilot-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction # required by the job queue (BullMQ)
    ipAllowList: [] # internal connections only

databases:
  - name: folderpilot-db
    region: frankfurt
    plan: free # expires after 30 days on Render's free plan; upgrade to keep data
    postgresMajorVersion: "16"
    ipAllowList: []
